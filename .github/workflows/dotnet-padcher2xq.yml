name: Padcher CI/CD

env:
  APP_VERSION: "2.0" 

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore Padcher2XQ.sln
    - name: Build application
      run: dotnet build Padcher2XQ.sln --configuration Release --no-restore
    - name: Publish Windows
      run: dotnet publish Padcher2XQ.sln --configuration Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfContained=true --output ./dist/windows
    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Padcher2XQ-Windows
        path: ./dist/windows

  build_linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore Padcher2XQ.sln
    - name: Build application
      run: dotnet build Padcher2XQ.sln --configuration Release --no-restore
    - name: Publish Linux
      run: dotnet publish Padcher2XQ.sln --configuration Release -r linux-x64 --self-contained true -p:PublishSingleFile=true --output ./dist/linux
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Padcher2XQ-Linux
        path: ./dist/linux

  publish_release:
    needs: [build_windows, build_linux]
    # Запускаємо реліз тільки на main або при пуші тегів
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Padcher2XQ-Windows
          path: ./release/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Padcher2XQ-Linux
          path: ./release/linux

      - name: Zip Windows Release
        run: zip -r -j Padcher2XQ-Windows.zip ./release/windows/*

      - name: Tar Linux Release
        run: tar -czvf Padcher2XQ-Linux.tar.gz -C ./release/linux .

      - name: Set Release Metadata
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Це офіційний реліз за тегом
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            # Це автоматичний білд з гілки main (Canary/Nightly)
            echo "TAG_NAME=${{ env.APP_VERSION }}-canary-${{ github.run_number }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Canary Build (${{ env.APP_VERSION }}.${{ github.run_number }})" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            Padcher2XQ-Windows.zip
            Padcher2XQ-Linux.tar.gz

env:
  APP_VERSION: "2.0" 

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore Padcher2XQ.sln
      
    - name: Build application
      run: dotnet build Padcher2XQ.sln --configuration Release --no-restore
      
    - name: Publish Windows
      run: dotnet publish Padcher2XQ.sln --configuration Release -r win-x64 --self-contained true -p:PublishSingleFile=true --output ./dist/windows
      
    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Padcher2XQ-Windows
        path: ./dist/windows

  build_linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore Padcher2XQ.sln
      
    - name: Build application
      run: dotnet build Padcher2XQ.sln --configuration Release --no-restore
      
    - name: Publish Linux
      run: dotnet publish Padcher2XQ.sln --configuration Release -r linux-x64 --self-contained true -p:PublishSingleFile=true --output ./dist/linux
      
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Padcher2XQ-Linux
        path: ./dist/linux

  publish_release:
    needs: [build_windows, build_linux]
    if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Padcher2XQ-Windows
          path: ./release/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Padcher2XQ-Linux
          path: ./release/linux

      - name: Zip Windows Release
        run: zip -r -j Padcher2XQ-Windows.zip ./release/windows/*

      - name: Tar Linux Release
        run: tar -czvf Padcher2XQ-Linux.tar.gz -C ./release/linux .

      - name: Generate Stable Version (For Master/Main)
        if: ${{ startsWith(github.ref, 'refs/heads/') }}
        run: |
          YEAR=$(date +'%y')
          LAST_TAG=$(git tag -l "${{ env.APP_VERSION }}*" | sort -V | tail -n1)

          if [ -z "$LAST_TAG" ]; then
            NEXT_NUM=1
          else
            LAST_NUM=$(echo $LAST_TAG | awk -F. '{print $NF}')
            NEXT_NUM=$((LAST_NUM + 1))
          fi

          TAG_NAME="${{ env.APP_VERSION }}"
          RELEASE_NAME="${{ env.APP_VERSION }}"

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "IS_PRERELEASE=true" >> $GITHUB_ENV

      - name: Set Release Version (For v* Tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "IS_PRERELEASE=false" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.IS_PRERELEASE == 'false' }}
          files: |
            Padcher2XQ-Windows.zip
            Padcher2XQ-Linux.tar.gz
          generate_release_notes: true
