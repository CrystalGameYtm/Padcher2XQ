name: Padcher CI/CD

env:
  APP_VERSION: "2.2"

on:
  push:
    branches: [ "stable", "canary" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "stable", "canary" ]

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore Padcher2XQ.sln
    - name: Build application
      run: dotnet build Padcher2XQ.sln --configuration Release --no-restore
    - name: Publish Windows
      run: dotnet publish Padcher2XQ.sln --configuration Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfContained=true --output ./dist/windows
    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Padcher2XQ-Windows
        path: ./dist/windows

  build_linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore Padcher2XQ.sln
    - name: Build application
      run: dotnet build Padcher2XQ.sln --configuration Release --no-restore
    - name: Publish Linux
      run: dotnet publish Padcher2XQ.sln --configuration Release -r linux-x64 --self-contained true -p:PublishSingleFile=true --output ./dist/linux
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Padcher2XQ-Linux
        path: ./dist/linux

  publish_release:
    needs: [build_windows, build_linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/canary' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Padcher2XQ-Windows
          path: ./release/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Padcher2XQ-Linux
          path: ./release/linux

      - name: Zip Windows Release
        run: zip -r -j Padcher2XQ-Windows.zip ./release/windows/*

      - name: Tar Linux Release
        run: tar -czvf Padcher2XQ-Linux.tar.gz -C ./release/linux .

      - name: Set Release Metadata
        id: metadata
        run: |
          if [[ "${{ github.ref }}" == refs/heads/canary ]]; then
            # Генеруємо рік (наприклад, 2026) та місяць (наприклад, 04)
            YEAR=$(date +'%Y')
            MONTH=$(date +'%m')
            
            # Збираємо красиву назву тегу: snapshot-2026.04-45
            echo "TAG_NAME=snapshot-${YEAR}.${MONTH}-${{ github.run_number }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=${{ env.APP_VERSION }} Snapshot ${YEAR}.${{ github.run_number }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            Padcher2XQ-Windows.zip
            Padcher2XQ-Linux.tar.gz
          generate_release_notes: true
