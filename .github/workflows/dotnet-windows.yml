name: .NET Avalonia Build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: Padcher2XQ-Windows
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: Padcher2XQ-Linux

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Padcher2XQ.sln

    - name: Build application
      run: dotnet build Padcher2XQ.sln --configuration Release --no-restore

    - name: Test application
      run: dotnet test Padcher2XQ.sln --configuration Release --no-build --verbosity normal

    - name: Publish artifacts
      # Публікуємо під конкретну платформу (RID) одним файлом
      run: dotnet publish Padcher2XQ.sln --configuration Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true --output ./dist

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ./dist
