name: .NET Avalonia Build & Release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

jobs:
  # 1. Збірка виключно для Windows
  build_windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore Padcher2XQ.sln
      
    - name: Build application
      run: dotnet build Padcher2XQ.sln --configuration Release --no-restore
      
    - name: Test application
      run: dotnet test Padcher2XQ.sln --configuration Release --no-build --verbosity normal
      
    - name: Publish artifacts
      run: dotnet publish Padcher2XQ.sln --configuration Release -r win-x64 --self-contained true -p:PublishSingleFile=true --output ./dist
      
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Padcher2XQ-Windows
        path: ./dist

  # 2. Збірка виключно для Linux
  build_linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore Padcher2XQ.sln
      
    - name: Build application
      run: dotnet build Padcher2XQ.sln --configuration Release --no-restore
      
    - name: Test application
      # Якщо тести на Linux будуть падати через Avalonia, цей рядок можна закоментувати
      run: dotnet test Padcher2XQ.sln --configuration Release --no-build --verbosity normal
      
    - name: Publish artifacts
      run: dotnet publish Padcher2XQ.sln --configuration Release -r linux-x64 --self-contained true -p:PublishSingleFile=true --output ./dist
      
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Padcher2XQ-Linux
        path: ./dist

  # 3. Створення релізу (запускається тільки якщо обидві збірки пройшли успішно)
  release:
    needs: [build_windows, build_linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Padcher2XQ-Windows
          path: ./release/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Padcher2XQ-Linux
          path: ./release/linux

      - name: Zip Windows Release
        run: zip -r -j Padcher2XQ-Windows.zip ./release/windows/*

      - name: Tar Linux Release
        run: tar -czvf Padcher2XQ-Linux.tar.gz -C ./release/linux .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Padcher2XQ-Windows.zip
            Padcher2XQ-Linux.tar.gz
          generate_release_notes: true
