name: .NET Avalonia Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
      
    - name: Restore dependencies
      run: dotnet restore Padcher2XQ.sln

    - name: Build application
      run: dotnet build Padcher2XQ.sln --configuration Release --no-restore
      
    - name: Test application
      run: dotnet test Padcher2XQ.sln --configuration Release --no-build --verbosity normal
      
    - name: Publish artifacts
      run: dotnet publish Padcher2XQ.sln --configuration Release --no-build --output ./dist
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Padcher2XQ-Windows
        path: ./dist
